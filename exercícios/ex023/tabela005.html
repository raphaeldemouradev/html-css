<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        .cnome {
            background-color: lightcoral;
        }

        .csexo {
            background-color: bisque;
        }

        .cgrup {
            background-color: lightsalmon;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cgrup" span="2">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td scope="col">Bruno</td>
            <td scope="col">M</td>
            <td scope="col">25</td>
            <td scope="col">Goleiro</td>
        </tr>
        <tr>
            <td scope="col">Robinho</td>
            <td scope="col">M</td>
            <td scope="col">30</td>
            <td scope="col">Atacante</td>
        </tr>
        <tr>
            <td scope="col">Leila</td>
            <td scope="col">F</td>
            <td scope="col">60</td>
            <td scope="col">Palmeiras</td>
        </tr>
        <tr>
            <td scope="col">Diddy</td>
            <td scope="col">M</td>
            <td scope="col">40</td>
            <td scope="col">Cantor</td>
        </tr>
        <tr>
            <td scope="col">Taylor</td>
            <td scope="col">F</td>
            <td scope="col">38</td>
            <td scope="col">Cantora</td>
        </tr>
        <tr>
            <td scope="col">Marta</td>
            <td scope="col">F</td>
            <td scope="col">35</td>
            <td scope="col">Atacante</td>
        </tr>
    </table>
</body>
</html>
